[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garboid-pocketrocks"
version = "0.1.0"
description = "PocketRocks bots, simulation, evaluation, and local training"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher Garber" },
]
dependencies = [
  "pocketrocks-python-sdk @ git+https://github.com/jaiparera/pocketrocks-python-sdk.git@597857446d47ac0890609a4767cad561578a2519",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
