[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garboid-pocketrocks"
version = "0.1.0"
description = "PocketRocks bots, simulation, evaluation, and local training"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher Garber" },
]
dependencies = [
  "gymnasium>=1.3.0",
  "numpy>=2.5.1",
  "pettingzoo>=1.26.1",
  "pocketrocks-python-sdk @ git+https://github.com/chrisgarber/pocketrocks-python-sdk.git@51cad378ee1e70a78e39ebbb25957ea003444873",
  "scipy>=1.17",
]

[project.optional-dependencies]
neural = [
  "torch>=2.13,<2.14",
]

[project.scripts]
garboid-bots = "garboid_pocketrocks.bots.launcher:main"
garboid-evolve-heuristic = "garboid_pocketrocks.evolution.cli:main"
garboid-promote = "garboid_pocketrocks.promotion.cli:main"
garboid-random-bot = "garboid_pocketrocks.bots.random_bot:main"
garboid-simulate = "garboid_pocketrocks.simulator.cli:main"
garboid-tournament = "garboid_pocketrocks.tournament.cli:main"
garboid-train = "garboid_pocketrocks.neural.cli:main"
garboid-visualize = "garboid_pocketrocks.visualizer.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "hypothesis>=6.163.0",
  "mypy",
  "pytest",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-n=auto",
  "--maxprocesses=8",
  "--dist=worksteal",
]
markers = [
  "neural_smoke: deterministic CPU PPO smoke contract",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
exclude = [
  "^src/garboid_pocketrocks/neural/",
  "^tests/neural/",
]
warn_unused_configs = true
