name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          python-version: "3.14"
          enable-cache: true

      - name: Synchronize dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

  neural:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          python-version: "3.14"
          enable-cache: true

      - name: Synchronize neural dependencies
        run: uv sync --locked --extra neural

      - name: Type-check complete neural tree
        run: uv run --extra neural mypy --config-file mypy.neural.ini src tests

      - name: Run neural unit tests
        run: uv run --extra neural pytest tests/neural -m "not neural_smoke" -q

      - name: Run trainer-backed self-play smoke
        run: >-
          uv run --extra neural pytest -n 0
          tests/neural/test_smoke.py::test_full_curriculum_smoke_contract_at_one_game_per_cell
          -q
